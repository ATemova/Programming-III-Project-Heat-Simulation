name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Benchmark smoke test
        run: java -jar target/heat-sim-*.jar benchmark --sizes 50,100 --runs 1 --workers 2 --threads 2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v1')
        uses: softprops/action-gh-release@v2
        with:
          files: target/heat-sim-*.jar
          body_path: RELEASE_NOTES.md
